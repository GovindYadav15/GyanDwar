name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===============================================================
  # 1. Backend Verification (Lint, DB Schema, Tests, NestJS Build)
  # ===============================================================
  backend-checks:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd backend
          npm run db:generate

      - name: Run Backend Tests
        run: |
          cd backend
          npm test

      - name: Build Backend (NestJS)
        run: |
          cd backend
          npm run build

  # ===============================================================
  # 2. Frontend Verification (Typecheck, Next.js Build)
  # ===============================================================
  frontend-checks:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend (Next.js)
        run: |
          cd frontend
          npm run build

  # ===============================================================
  # 3. Deploy Backend to Render (On push/merge to main)
  # ===============================================================
  deploy-backend-render:
    name: Deploy Backend to Render
    needs: [backend-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "🚀 Triggering Render deployment for examsathi-backend..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          HTTP_BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')
          echo "Render Response: $HTTP_BODY"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Render deployment initiated successfully (HTTP $HTTP_STATUS)!"
          else
            echo "::error::Render deployment hook failed with HTTP $HTTP_STATUS: $HTTP_BODY"
            exit 1
          fi

      - name: Render Deploy Hook Notice
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "::notice title=Render Deploy Hook Not Configured::RENDER_DEPLOY_HOOK_URL secret is not set in GitHub repository settings. If your Render service has 'autoDeploy: true', Render deploys directly from GitHub. To trigger deployment explicitly after CI passes, add RENDER_DEPLOY_HOOK_URL to GitHub Repository Secrets (obtained from Render Service Settings > Deploy Hook)."

  # ===============================================================
  # 4. Deploy Frontend to Vercel (On push/merge to main)
  # ===============================================================
  deploy-frontend-vercel:
    name: Deploy Frontend to Vercel
    needs: [frontend-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel (Production)
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "🚀 Deploying Next.js frontend to Vercel production..."
          cd frontend
          npx --yes vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          npx --yes vercel build --prod --token=$VERCEL_TOKEN
          DEPLOY_URL=$(npx --yes vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          echo "✅ Deployed to Vercel: $DEPLOY_URL"

      - name: Vercel Deployment Notice
        if: env.VERCEL_TOKEN == ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "::notice title=Vercel Token Not Configured::VERCEL_TOKEN secret is not set in GitHub repository settings. If you linked your GitHub repo directly in the Vercel dashboard, Vercel deploys automatically on push to main. To deploy via GitHub Actions, add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID secrets."
