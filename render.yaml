services:
  - type: web
    name: examsathi-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npm run db:generate && npm run build && npx prisma db push --schema=./prisma/schema.prisma
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health/liveness
    autoDeploy: false # Managed via GitHub Actions CI/CD pipeline on merge to main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard: your PostgreSQL connection string
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: APP_URL
        sync: false # Set to your Vercel frontend URL, e.g. https://vercel.app
      - key: API_URL
        sync: false # Set to your Render backend URL, e.g. https://onrender.com
      - key: ESEWA_MERCHANT_CODE
        value: EPAYTEST
      - key: ESEWA_SECRET_KEY
        value: 8gBm/:&EnhH.1/q
      - key: ESEWA_BASE_URL
        value: https://esewa.com.np
      - key: KHALTI_BASE_URL
        value: https://khalti.com
